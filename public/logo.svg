<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 465" width="600" height="465">
  <defs>
    <!-- Soft Luxury Light Emerald & Mint Pearl Radial Background -->
    <radialGradient id="logoBgRadial" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f2faf5" />
      <stop offset="80%" stop-color="#def2e6" />
      <stop offset="100%" stop-color="#c6e8d4" />
    </radialGradient>

    <!-- Ultra-Luminous 3D Metallic Champagne Gold Gradient -->
    <linearGradient id="hdGold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#fff1b3" />
      <stop offset="35%" stop-color="#f5d061" />
      <stop offset="60%" stop-color="#c9971e" />
      <stop offset="85%" stop-color="#8a600a" />
      <stop offset="95%" stop-color="#e8bf56" />
      <stop offset="100%" stop-color="#ffe699" />
    </linearGradient>

    <linearGradient id="hdGoldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffea9f" />
      <stop offset="70%" stop-color="#c59828" />
      <stop offset="100%" stop-color="#734f07" />
    </linearGradient>

    <!-- Building Front Face Facet (Pure Pearl White) -->
    <linearGradient id="hdBldgFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f4fbf7" />
      <stop offset="100%" stop-color="#dcf0e4" />
    </linearGradient>

    <!-- Gold 3D Shadow Side -->
    <linearGradient id="hdGoldSide" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b88318" />
      <stop offset="50%" stop-color="#785308" />
      <stop offset="100%" stop-color="#452c02" />
    </linearGradient>

    <!-- Drop Shadows for Crisp Definition -->
    <filter id="hdDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0a4328" flood-opacity="0.2" />
    </filter>
    
    <filter id="hdTextShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="584" height="449" rx="26" fill="url(#logoBgRadial)" stroke="url(#hdGold3D)" stroke-width="2.5" />
  <rect x="16" y="16" width="568" height="433" rx="18" fill="none" stroke="#0e6d42" stroke-width="1.2" opacity="0.25" stroke-dasharray="6 4" />

  <!-- 1. Architectural 3D Gold Emblem (Strictly between y=32px and y=219px) -->
  <g filter="url(#hdDropShadow)" transform="translate(300, 135) scale(0.50)">
    
    <!-- Grand Moorish Outer Arch -->
    <path 
      d="M -150 145 V -15 C -150 -105, -90 -175, 0 -205 C 90 -175, 150 -105, 150 -15 V 145 L 120 145 V -15 C 120 -90, 65 -150, 0 -175 C -65 -150, -120 -90, -120 -15 V 145 Z" 
      fill="url(#hdGold3D)" 
    />

    <!-- Arch Inner Golden Bevel Trim -->
    <path 
      d="M -105 145 V -12 C -105 -72, -55 -128, 0 -152 C 55 -128, 105 -72, 105 -12 V 145" 
      fill="none" 
      stroke="url(#hdGoldBevel)" 
      stroke-width="4" 
      stroke-linecap="round"
      opacity="0.95"
    />

    <!-- Left Skyscraper Tower -->
    <polygon points="-100,135 -100,-35 -48,-78 -48,135" fill="url(#hdBldgFront)" />
    <polygon points="-48,-78 -26,-62 -26,135 -48,135" fill="url(#hdGoldSide)" />
    <g fill="#0b4a2e" opacity="0.85">
      <rect x="-90" y="-10" width="14" height="32" rx="1.5" />
      <rect x="-90" y="36" width="14" height="32" rx="1.5" />
      <rect x="-90" y="82" width="14" height="32" rx="1.5" />
      <rect x="-68" y="-24" width="14" height="32" rx="1.5" />
      <rect x="-68" y="22" width="14" height="32" rx="1.5" />
      <rect x="-68" y="68" width="14" height="32" rx="1.5" />
    </g>

    <!-- Center Grand Skyscraper Tower -->
    <polygon points="-22,135 -22,-120 22,-162 25,-158 25,135" fill="url(#hdBldgFront)" />
    <polygon points="25,-158 54,-135 54,135 25,135" fill="url(#hdGoldSide)" />
    <g fill="#0b4a2e" opacity="0.88">
      <rect x="-14" y="-85" width="12" height="24" rx="1.5" />
      <rect x="-14" y="-50" width="12" height="24" rx="1.5" />
      <rect x="-14" y="-15" width="12" height="24" rx="1.5" />
      <rect x="-14" y="20" width="12" height="24" rx="1.5" />
      <rect x="-14" y="55" width="12" height="24" rx="1.5" />
      <rect x="-14" y="90" width="12" height="24" rx="1.5" />
      <rect x="4" y="-102" width="12" height="24" rx="1.5" />
      <rect x="4" y="-67" width="12" height="24" rx="1.5" />
      <rect x="4" y="-32" width="12" height="24" rx="1.5" />
      <rect x="4" y="3" width="12" height="24" rx="1.5" />
      <rect x="4" y="38" width="12" height="24" rx="1.5" />
      <rect x="4" y="73" width="12" height="24" rx="1.5" />
    </g>

    <!-- Right Tower -->
    <polygon points="60,135 60,-60 105,-34 105,135" fill="url(#hdGold3D)" />
    <polygon points="105,-34 118,-24 118,135 105,135" fill="url(#hdGoldSide)" />
    <g stroke="#083823" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
      <line x1="68" y1="-26" x2="96" y2="-10" />
      <line x1="68" y1="-5" x2="96" y2="11" />
      <line x1="68" y1="16" x2="96" y2="32" />
      <line x1="68" y1="37" x2="96" y2="53" />
      <line x1="68" y1="58" x2="96" y2="74" />
      <line x1="68" y1="79" x2="96" y2="95" />
      <line x1="68" y1="100" x2="96" y2="116" />
    </g>

    <!-- Grand Dome -->
    <path d="M -65 145 C -65 75, 65 75, 65 145 Z" fill="url(#hdGold3D)" />
    <path d="M -50 145 C -50 88, 50 88, 50 145 Z" fill="none" stroke="url(#hdGoldBevel)" stroke-width="2.5" opacity="0.85" />
    <path d="M 0 75 V 46" stroke="url(#hdGold3D)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="42" r="4" fill="#ffffff" />

    <!-- Base Platforms -->
    <path d="M -195 158 Q 0 132 195 158" fill="none" stroke="url(#hdGold3D)" stroke-width="6" stroke-linecap="round" />
    <path d="M -155 168 Q 0 145 155 168" fill="none" stroke="url(#hdGoldBevel)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- 2. ENGLISH BRAND TITLE (Placed at y=278: Clean 59px separation below building platform!) -->
  <g filter="url(#hdTextShadow)">
    <text 
      x="300" 
      y="278" 
      text-anchor="middle" 
      font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" 
      font-size="38" 
      font-weight="900" 
      letter-spacing="5"
      fill="#0a4d30"
    >
      BIN ABBAS
    </text>

    <text 
      x="300" 
      y="312" 
      text-anchor="middle" 
      font-family="'Segoe UI', -apple-system, sans-serif" 
      font-size="18" 
      font-weight="800" 
      letter-spacing="12"
      fill="#b88318"
    >
      PROPERTIES
    </text>
  </g>

  <!-- 3. URDU CALLIGRAPHY: بن عباس پراپرٹیز (Clean, prominent, deep emerald font) -->
  <text 
    x="300" 
    y="380" 
    text-anchor="middle" 
    font-family="'Noto Sans Arabic', 'Jameel Noori Nastaleeq', serif" 
    font-size="44" 
    font-weight="900"
    fill="#073d25"
    direction="rtl"
  >
    بن عباس پراپرٹیز
  </text>

  <!-- 4. LOCATION TAGLINE -->
  <text 
    x="300" 
    y="418" 
    text-anchor="middle" 
    font-family="'Noto Sans Arabic', sans-serif" 
    font-size="18" 
    font-weight="bold"
    fill="#7a5509"
    direction="rtl"
  >
    رائل پام سٹی، گوجرانوالہ
  </text>

  <!-- Bottom Accent Golden Arc -->
  <path d="M 140 442 Q 300 432 460 442" fill="none" stroke="url(#hdGold3D)" stroke-width="2" opacity="0.85" stroke-linecap="round" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Luminous Light Mint Pearl Gradient Canvas -->
    <radialGradient id="iconCanvasBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f5fbf7" />
      <stop offset="75%" stop-color="#e0f3e7" />
      <stop offset="100%" stop-color="#c6e9d4" />
    </radialGradient>

    <!-- Master 24K Champagne Gold 3D Luminous Gradient -->
    <linearGradient id="iconGold3DGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#fff1b0" />
      <stop offset="35%" stop-color="#f5ce5e" />
      <stop offset="60%" stop-color="#ca9820" />
      <stop offset="85%" stop-color="#8c6109" />
      <stop offset="95%" stop-color="#e8bf56" />
      <stop offset="100%" stop-color="#ffe696" />
    </linearGradient>

    <!-- Arch Inner Golden Bevel -->
    <linearGradient id="iconGoldBevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffea9a" />
      <stop offset="70%" stop-color="#c59726" />
      <stop offset="100%" stop-color="#734e06" />
    </linearGradient>

    <!-- Building Front Pearl White Facet -->
    <linearGradient id="iconBldgWhiteFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f6fcf9" />
      <stop offset="100%" stop-color="#e0f2e7" />
    </linearGradient>

    <!-- 3D Gold Building Shadow Side -->
    <linearGradient id="iconGoldSideGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b98519" />
      <stop offset="50%" stop-color="#7a5409" />
      <stop offset="100%" stop-color="#462c03" />
    </linearGradient>

    <linearGradient id="iconPhoneBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fff6c8" />
      <stop offset="55%" stop-color="#e5b236" />
      <stop offset="85%" stop-color="#ab7b10" />
      <stop offset="100%" stop-color="#f8d66e" />
    </linearGradient>

    <linearGradient id="iconPhoneInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a4d30" />
      <stop offset="50%" stop-color="#063822" />
      <stop offset="100%" stop-color="#032415" />
    </linearGradient>

    <linearGradient id="iconPhoneGoldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fff3b8" />
      <stop offset="70%" stop-color="#eec34b" />
      <stop offset="100%" stop-color="#bc8a15" />
    </linearGradient>

    <!-- 3D Soft Drop Shadow for Emblem & Text -->
    <filter id="iconUltraHdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0a4328" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" fill="url(#iconCanvasBg)" rx="112" />

  <!-- Outer Elegant Gold & Emerald Rings -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#iconGold3DGrad)" stroke-width="3" opacity="0.85" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#0e6d42" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 4" />

  <!-- Complete 3D Emblem & Brand Elements (Scaled within safe bounds) -->
  <g filter="url(#iconUltraHdShadow)">
    
    <!-- 1. Moorish 3D Gold Arch & Buildings Emblem -->
    <g transform="translate(256, 175) scale(0.60)">
      <!-- Outer Moorish Arch -->
      <path 
        d="M -150 145 V -15 C -150 -105, -90 -175, 0 -205 C 90 -175, 150 -105, 150 -15 V 145 L 120 145 V -15 C 120 -90, 65 -150, 0 -175 C -65 -150, -120 -90, -120 -15 V 145 Z" 
        fill="url(#iconGold3DGrad)" 
      />

      <!-- Arch Inner Golden Bevel Trim -->
      <path 
        d="M -105 145 V -12 C -105 -72, -55 -128, 0 -152 C 55 -128, 105 -72, 105 -12 V 145" 
        fill="none" 
        stroke="url(#iconGoldBevelGrad)" 
        stroke-width="4" 
        stroke-linecap="round"
        opacity="0.95"
      />

      <!-- Left Skyscraper Tower -->
      <polygon points="-100,135 -100,-35 -48,-78 -48,135" fill="url(#iconBldgWhiteFacet)" />
      <polygon points="-48,-78 -26,-62 -26,135 -48,135" fill="url(#iconGoldSideGrad)" />
      <g fill="#0b4a2e" opacity="0.9">
        <rect x="-90" y="-10" width="14" height="32" rx="1.5" />
        <rect x="-90" y="36" width="14" height="32" rx="1.5" />
        <rect x="-90" y="82" width="14" height="32" rx="1.5" />
        <rect x="-68" y="-24" width="14" height="32" rx="1.5" />
        <rect x="-68" y="22" width="14" height="32" rx="1.5" />
        <rect x="-68" y="68" width="14" height="32" rx="1.5" />
      </g>

      <!-- Center Grand Skyscraper Tower -->
      <polygon points="-22,135 -22,-120 22,-162 25,-158 25,135" fill="url(#iconBldgWhiteFacet)" />
      <polygon points="25,-158 54,-135 54,135 25,135" fill="url(#iconGoldSideGrad)" />
      <g fill="#0b4a2e" opacity="0.92">
        <rect x="-14" y="-85" width="12" height="24" rx="1.5" />
        <rect x="-14" y="-50" width="12" height="24" rx="1.5" />
        <rect x="-14" y="-15" width="12" height="24" rx="1.5" />
        <rect x="-14" y="20" width="12" height="24" rx="1.5" />
        <rect x="-14" y="55" width="12" height="24" rx="1.5" />
        <rect x="-14" y="90" width="12" height="24" rx="1.5" />
        <rect x="4" y="-102" width="12" height="24" rx="1.5" />
        <rect x="4" y="-67" width="12" height="24" rx="1.5" />
        <rect x="4" y="-32" width="12" height="24" rx="1.5" />
        <rect x="4" y="3" width="12" height="24" rx="1.5" />
        <rect x="4" y="38" width="12" height="24" rx="1.5" />
        <rect x="4" y="73" width="12" height="24" rx="1.5" />
      </g>

      <!-- Right Tower -->
      <polygon points="60,135 60,-60 105,-34 105,135" fill="url(#iconGold3DGrad)" />
      <polygon points="105,-34 118,-24 118,135 105,135" fill="url(#iconGoldSideGrad)" />
      <g stroke="#083823" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
        <line x1="68" y1="-26" x2="96" y2="-10" />
        <line x1="68" y1="-5" x2="96" y2="11" />
        <line x1="68" y1="16" x2="96" y2="32" />
        <line x1="68" y1="37" x2="96" y2="53" />
        <line x1="68" y1="58" x2="96" y2="74" />
        <line x1="68" y1="79" x2="96" y2="95" />
        <line x1="68" y1="100" x2="96" y2="116" />
      </g>

      <!-- Grand Dome -->
      <path d="M -65 145 C -65 75, 65 75, 65 145 Z" fill="url(#iconGold3DGrad)" />
      <path d="M -50 145 C -50 88, 50 88, 50 145 Z" fill="none" stroke="url(#iconGoldBevelGrad)" stroke-width="2.5" opacity="0.85" />
      <path d="M 0 75 V 46" stroke="url(#iconGold3DGrad)" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="0" cy="42" r="4" fill="#ffffff" />

      <!-- Base Curved Wings / Swoops -->
      <path d="M -195 158 Q 0 132 195 158" fill="none" stroke="url(#iconGold3DGrad)" stroke-width="6" stroke-linecap="round" />
      <path d="M -155 168 Q 0 145 155 168" fill="none" stroke="url(#iconGoldBevelGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    </g>

    <!-- 2. "BIN ABBAS" Primary Brand Title -->
    <text 
      x="256" 
      y="322" 
      text-anchor="middle" 
      font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" 
      font-size="34" 
      font-weight="900" 
      letter-spacing="4"
      fill="#0a482b"
    >
      BIN ABBAS
    </text>

    <!-- 3. "PROPERTIES" Subtitle -->
    <text 
      x="256" 
      y="350" 
      text-anchor="middle" 
      font-family="'Segoe UI', -apple-system, sans-serif" 
      fontSize="15" 
      font-weight="800" 
      letter-spacing="9"
      fill="#b88318"
    >
      PROPERTIES
    </text>

    <!-- 4. 3D Embossed Mobile Number Plaque (0320.4800071) -->
    <g transform="translate(256, 402)">
      <!-- Outer 3D Gold Rim Plaque -->
      <rect 
        x="-165" 
        y="-24" 
        width="330" 
        height="48" 
        rx="24" 
        fill="url(#iconPhoneBadgeGrad)" 
        stroke="url(#iconGold3DGrad)" 
        stroke-width="2" 
      />
      
      <!-- Inner Royal Deep Emerald Inset -->
      <rect 
        x="-161" 
        y="-20" 
        width="322" 
        height="40" 
        rx="20" 
        fill="url(#iconPhoneInnerGrad)" 
        stroke="#c59828" 
        stroke-width="1.2" 
      />

      <!-- 3D Phone Icon -->
      <g transform="translate(-125, 0) scale(0.85)">
        <circle cx="0" cy="0" r="13" fill="url(#iconGold3DGrad)" />
        <path 
          d="M -5 -6 C -6 -5, -6 -3, -4 0 C -2 3, 0 5, 3 6 C 5 7, 7 6, 8 4 L 6.5 2 C 6 1.5, 5 1.5, 4.5 2 L 3.5 2.8 C 2.5 2.2, 1.8 1.5, 1.2 0.5 L 2 -0.5 C 2.5 -1, 2.5 -2, 2 -2.5 L 0 -4.5 C -0.5 -5, -1.5 -5, -2 -4.5 Z" 
          fill="#042617" 
        />
      </g>

      <!-- 3D Embossed Mobile Number -->
      <text 
        x="12" 
        y="8" 
        text-anchor="middle" 
        font-family="'Trebuchet MS', 'Arial Black', -apple-system, sans-serif" 
        font-size="23" 
        font-weight="900" 
        letter-spacing="2.2"
        fill="url(#iconPhoneGoldText)"
        stroke="#021a0f"
        stroke-width="0.8"
      >
        0320.4800071
      </text>
    </g>

  </g>
</svg>
